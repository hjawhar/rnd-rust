[package]
name = "solana-rpc-tester"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-appender = "0.2.3"

tokio = { version = "1.47.1", features = ["full", "rt-multi-thread"] }
futures = "0.3.31"

tonic = "0.12.3"
tonic-health = "0.12.3"

yellowstone-grpc-client = "8.0.0"
yellowstone-grpc-proto = { version = "8.0.0", features = ["plugin"] }

async-recursion = "1.1.1"

serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"

prost = "0.13.1"

solana-rpc-client = "2.1.13"
solana-rpc-client-api = "2.1.13"
solana-pubkey = "2.1.13"
solana-keypair = "2.1.13"
solana-signature = "2.1.13"
solana-signer = "2.1.13"
spl-associated-token-account = "7.0.0"
solana-sdk = "2.1.13"

base64 = "0.22.1"
bincode = { version = "2.0.1", features = ["serde", "std", "derive"] }
reqwest = "0.12.23"
