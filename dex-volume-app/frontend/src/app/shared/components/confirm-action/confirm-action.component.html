<h2 mat-dialog-title>{{ data && data.title ? data.title: 'Loading...' }}</h2>
<mat-dialog-content>
    Are you sure you want to {{ data && data.action ? data.action: 'Loading...' }}?
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-raised-button type="button" (click)="dialogRef.close(true)">Confirm</button>
    <button mat-raised-button type="button" (click)="dialogRef.close()">Cancel</button>
</mat-dialog-actions>
