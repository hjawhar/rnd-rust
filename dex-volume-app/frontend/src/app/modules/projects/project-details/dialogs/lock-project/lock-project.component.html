<h2 mat-dialog-title>Lock Project</h2>
<mat-dialog-content>
    <div class="lock-options">
        <label class="lock-option">
            <input type="radio" name="mode" value="immediate" [(ngModel)]="mode">
            <span>Lock immediately</span>
        </label>
        <label class="lock-option">
            <input type="radio" name="mode" value="scheduled" [(ngModel)]="mode">
            <span>Schedule lock at</span>
        </label>
        @if (mode === 'scheduled') {
        <div class="datetime-field">
            <input type="datetime-local" [formControl]="datetimeControl" [min]="minDatetime">
        </div>
        }
    </div>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-raised-button type="button" (click)="confirm()"
        [disabled]="mode === 'scheduled' && !datetimeControl.value">Confirm</button>
    <button mat-raised-button type="button" (click)="dialogRef.close()">Cancel</button>
</mat-dialog-actions>
