<div class="table-toolbar">
    <div class="table-filter">
        <i class="bi bi-search"></i>
        <input matInput (keyup)="applyFilter($event)" placeholder="Filter wallets..." #input>
    </div>
    <div class="table-actions">
        <span class="toolbar-btn" (click)="refreshWallets.emit(true)" title="Refresh balances">
            <i class="bi bi-arrow-clockwise"></i>
        </span>
        <span class="toolbar-btn" (click)="importWallets()">
            <i class="bi bi-upload"></i> Import
        </span>
        <span class="toolbar-btn" (click)="exportWallets()">
            <i class="bi bi-download"></i> Export
        </span>
        <span class="toolbar-btn" (click)="generateWallets()">
            <i class="bi bi-plus-circle"></i> Generate
        </span>
        <span class="toolbar-btn toolbar-btn-danger" (click)="deleteWallets()">
            <i class="bi bi-trash"></i> Delete
        </span>
    </div>
</div>

<div class="table-container">
    <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef style="width: 60px;">
                <div class="checkbox-wrapper">
                    <input type="checkbox" class="custom-checkbox" (change)="toggleAllRowsWallets($event)"
                        [checked]="selectionWallets.hasValue() && isAllSelectedWallets()">
                </div>
            </th>
            <td mat-cell *matCellDef="let row">
                <input type="checkbox" class="custom-checkbox" [checked]="selectionWallets.isSelected(row.id)"
                    (change)="$event ? selectionWallets.toggle(row.id) : null; _onCheckedWallet(row.id, $event)">
            </td>
        </ng-container> 

        <ng-container matColumnDef="sell_fields">
            <th mat-header-cell *matHeaderCellDef> Quick Sell </th>
            <td mat-cell *matCellDef="let row">
                <div class="sell-buttons">
                    <span class="sell-btn" (click)="_sellWallets([row.id], 100)">100%</span>
                    <span class="sell-btn" (click)="_sellWallets([row.id], 75)">75%</span>
                    <span class="sell-btn" (click)="_sellWallets([row.id], 50)">50%</span>
                    <span class="sell-btn" (click)="_sellWallets([row.id], 25)">25%</span>
                    <span class="sell-btn" (click)="_sellWallets([row.id], 10)">10%</span>
                    <div class="sell-custom">
                        <input class="sell-input" matInput type="number" [(ngModel)]="row.sell_percentage" placeholder="%">
                        <span class="sell-btn sell-btn-action" (click)="_sellWallets([row.id], row.sell_percentage)">Sell</span>
                    </div>
                </div>
            </td>
        </ng-container>

        <ng-container matColumnDef="wallet">
            <th mat-header-cell *matHeaderCellDef> Wallet </th>
            <td mat-cell *matCellDef="let row">
                <a class="table-link" [href]="explorerBaseUrl+'/address/'+row.address" target="_blank">
                    <i class="bi bi-box-arrow-up-right me-1"></i>
                    {{row.address}}
                </a>
            </td>
        </ng-container>

        <ng-container matColumnDef="token_balance">
            <th mat-header-cell *matHeaderCellDef> Tokens </th>
            <td mat-cell *matCellDef="let row">
                <span class="mono-value">{{row.token_balance | number:'1.2-2'}}</span>
            </td>
        </ng-container>

        <ng-container matColumnDef="native_balance">
            <th mat-header-cell *matHeaderCellDef> {{nativeSymbol}} </th>
            <td mat-cell *matCellDef="let row">
                <span class="mono-value">{{row.native_balance | number:'1.4-4'}}</span>
            </td>
        </ng-container> 

        <ng-container matColumnDef="total_usdc">
            <th mat-header-cell *matHeaderCellDef> Total </th>
            <td mat-cell *matCellDef="let row">
                <span class="mono-value">{{row.total_usdc | number:'1.2-2'}}</span>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data-cell" colspan="100">
                <i class="bi bi-inbox"></i>
                No wallets matching "{{input.value}}"
            </td>
        </tr>
    </table>

    <mat-paginator [pageSize]="25" [pageSizeOptions]="[5, 10, 25, 100]"
        aria-label="Select page of wallets"></mat-paginator>
</div>
