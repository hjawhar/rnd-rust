<div class="row mb-2">
    <div class="col-12">
        <h4 class="m-0">Create New Project</h4>
    </div>
</div>
<hr class="mt-2" />

<div class="row">
    <div class="col-12">
        <form [formGroup]="createProjectForm" (ngSubmit)="save()">
            <ng-container *ngIf="!isLoading">
                <div class="row mb-2">
                    <div class="col-12">
                        <div>Network</div>
                        <select formControlName="network">
                            <ng-container *ngFor="let network of networks">
                                <option [value]="network.id">
                                    {{network.label}}
                                </option>
                            </ng-container>
                        </select>
                    </div>
                </div>

                <div class="row mb-2">
                    <div class="col-12">
                        <div>Mint address</div>
                        <input matInput formControlName="address" type="text">
                    </div>
                </div>

                <div class="row mb-2">
                    <div class="col-12">
                        <div>Trading Strategy</div>
                        <select formControlName="trading_strategy">
                            <ng-container *ngFor="let tradingStrategy of tradingStrategies">
                                <option [value]="tradingStrategy.id">
                                    {{tradingStrategy.label}}
                                </option>
                            </ng-container>
                        </select>
                    </div>
                </div>

                <div class="row mb-2">
                    <div class="col-12">
                        <div>Pool</div>
                        <select formControlName="pool">
                            <ng-container *ngFor="let pool of pools">
                                <option [value]="pool.pool_address">
                                    {{pool.name}} (Fee: {{pool.fee}}%) - Pool: {{pool.pool_address | slice:0:6}}...{{pool.pool_address | slice:-4}} - {{pool.token0 | slice:0:6}}...{{pool.token0 | slice:-4}} / {{pool.token1 | slice:0:6}}...{{pool.token1 | slice:-4}} - Liquidity: {{formatLiquidity(pool.balance0)}} / {{formatLiquidity(pool.balance1)}} TOKEN
                                </option>
                            </ng-container>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 d-flex justify-end">
                        <button mat-raised-button [disabled]="createProjectForm.invalid" type="submit">
                            Save
                        </button>
                    </div>
                </div>
            </ng-container>

            <ng-container *ngIf="isLoading">
                <div class="row mb-2">
                    <div class="col-12 d-flex align-content-center align-items-center justify-center">
                        <img src="./assets/images/loading.svg">
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 d-flex align-content-center align-items-center justify-center text-xs">
                        This might take some time...
                    </div>
                </div>
            </ng-container>
        </form>
    </div>
</div>
