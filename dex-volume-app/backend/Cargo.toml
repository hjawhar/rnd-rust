[workspace]
resolver = "3"
members = [
    "bin/worker-sol",
    "bin/worker-evm",
    "bin/api-server",
    "crates/vm-solana",
    "crates/vm-evm",
    "crates/vm-data",
    "crates/vm-nats",
    "crates/vm-redis",
    "crates/vm-volume",
]

[workspace.dependencies]
dotenv = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.138"

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.3"

diesel = { version = "2.3.6", features = ["postgres", "numeric", "serde_json"] }
diesel-async = { version = "0.7.4", features = [
    "postgres",
    "async-connection-wrapper",
    "deadpool",
] }


solana-sdk = "3.0"
solana-pubkey = "3.0"
solana-keypair = "3.1"
solana-signature = "3.2"
solana-signer = "3.0"
solana-account-decoder-client-types = "3.1"
solana-rpc-client = "3.1"
solana-rpc-client-api = "3.1"
solana-commitment-config = "3.1"
solana-native-token = "3.0"
solana-system-interface = { version = "3.0", features = ["bincode"] }
solana-compute-budget-interface = "3.0"

spl-associated-token-account = "8.0"
spl-token = { version = "9.0", features = ["no-entrypoint"] }
spl-token-2022 = { version = "10.0", default-features = false, features = ["no-entrypoint"] }
spl-token-metadata-interface = "0.8"
mpl-token-metadata = "5.1.2-alpha.2"

yellowstone-grpc-proto = { version = "11.0", features = ["plugin"] }

tokio = { version = "1.43.0", features = ["rt-multi-thread", "time", "sync", "macros", "signal"] }
tokio-util = "0.7"

futures = "0.3.31"
reqwest = { version = "0.13.2", features = ["json"] }
bs58 = "0.5.1"

bigdecimal = { version = "0.4.7", features = ["serde"] }
rand = "0.9.1"
borsh = "1.6"
base64 = "0.22.1"
bincode = { version = "2.0.1", features = ["serde", "std", "derive"] }


dashmap = "6"
hex = "0.4.3"
ring = "0.17.5"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
once_cell = "1.20.3"

redis = { version = "1.0.3", features = ["aio", "tokio-comp"] }
uuid = { version = "1.13.1", features = ["v4", "fast-rng"] }

vm-solana = { path = "./crates/vm-solana" }
vm-evm = { path = "./crates/vm-evm" }
vm-data = { path = "./crates/vm-data" }
vm-nats = { path = "./crates/vm-nats" }
vm-redis = { path = "./crates/vm-redis" }
vm-volume = { path = "./crates/vm-volume" }

alloy = { version = "1.1", features = ["essentials", "reqwest", "network"] }

async-nats = "0.46"

axum = { version = "0.8.8", features = ["ws"] }
axum-extra = { version = "0.12.5", features = ["typed-header"] }
tower-http = { version = "0.6.8", features = ["trace", "cors", "timeout"] }
tower = { version = "0.5", features = ["limit"] }

diesel_migrations = "2.3.1"
futures-util = "0.3.31"
regex = "1.11.1"
validator = { version = "0.20.0", features = ["derive"] }

http-body-util = "0.1.3"
bytes = "1.10.1"

serenity = "0.12"

tonic = "0.14"
tonic-health = "0.14"

yellowstone-grpc-client = "11.0"

prost = "0.14"
chrono = "0.4"

# Test infrastructure (workspace-level, used as dev-dependencies by crates)
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "redis", "nats"] }

