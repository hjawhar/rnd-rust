[package]
name = "axsys-sol-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenv = "0.15.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-appender = "0.2.3"

tokio = { version = "1.43.0", features = ["full", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.26.1", features = ["native-tls"] }
axum = { version = "0.8.1", features = ["ws"] }
axum-extra = { version = "0.10.0", features = ["typed-header"] }
tower-http = { version = "0.6.2", features = ["trace", "cors"] }

serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
reqwest = { version = "0.12.12", features = ["json"] }
bigdecimal = { version = "0.4.7", features = ["serde"] }

futures = "0.3.31"
futures-util = "0.3.31"
# async-trait = "0.1.86"
async-recursion = "1.1.1"
uuid = { version = "1.13.1", features = ["v4", "fast-rng"] }
bs58 = "0.5.1"
regex = "1.11.1"


solana-pubkey = "2.1.13"
solana-sdk = "2.1.13"
solana-rpc-client = "2.1.13"
solana-signature = "2.1.13"
solana-rpc-client-api = "2.1.13"
solana-transaction-status-client-types = "2.1.13"
solana-transaction-status = "2.1.13"
spl-token = "7.0.0"
spl-associated-token-account = "6.0.0"

yellowstone-grpc-client = "5.0.0"
yellowstone-grpc-proto = { version = "5.0.0", features = ["plugin"] }

jupiter-swap-api-client = { path = "../../crates/jupiter-swap-api-client" }
base64 = "0.22.1"
bincode = "1.3.3"
tonic = "0.12.3"
tonic-health = "0.12.3"
log = "0.4.26"
hex = "0.4.3"
anyhow = "1.0.97"
jito-sdk-rust = "0.1.0"
axsys = { path = "../../crates/axsys" }
client = { path = "../../crates/client" }
models = { path = "../../crates/models" } 
solana-rpc-client-nonce-utils = "2.1.14"
solana-account-decoder-client-types = "2.1.13"
