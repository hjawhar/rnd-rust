[package]
name = "webapp"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenv = "0.15.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-appender = "0.2.3"

axum = { version = "0.8.1", features = ["ws"] }
axum-extra = { version = "0.10.0", features = ["typed-header"] }
tower-http = { version = "0.6.2", features = ["trace", "cors"] }

tokio = { version = "1.43.0", features = ["full", "rt-multi-thread"] }

serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
uuid = { version = "1.13.1", features = ["v4", "fast-rng"] }
alloy = { version = "0.11.0", features = [
    "full",
    "node-bindings",
    "rpc-types-debug",
    "rpc-types-trace",
] }
jsonwebtoken = "9.3.1"

reqwest = { version = "0.12.12" }

diesel = { version = "2.2.4", features = [
    "postgres",
    "32-column-tables",
    "numeric",
] }
diesel-async = { version = "0.5.0", features = [
    "postgres",
    "async-connection-wrapper",
] }
diesel_migrations = "2.1.0"
ring = "0.17.5"
bs58 = "0.5.1"
once_cell = "1.20.3"

futures = "0.3.31"
futures-util = "0.3.31"
regex = "1.11.1"
bigdecimal = { version = "0.4.7", features = ["serde"] }
validator = { version = "0.20.0", features = ["derive"] }

solana-pubkey = "2.1.13"
solana-sdk = "2.1.13"
solana-rpc-client = "2.1.13"
axsys = { path = "../../crates/axsys" }
models = { path = "../../crates/models" }

solana-rpc-client-nonce-utils = "2.1.14"
solana-account-decoder-client-types = "2.1.13"
solana-rpc-client-api = "2.1.13"
