<div class="row">
    <div class="col-12">
        <h4 class="m-0">Wallets</h4>
    </div>
</div>

<hr class="mt-2" />

<div class="row mb-0">
    <div class="col-12 d-flex">
        <span class="h-spacer"></span>
        <button mat-raised-button class="me-2" (click)="generateWallets()">
            Generate
        </button>
        <button mat-raised-button class="me-2" (click)="importWallets()">
            Import
        </button>
        <button mat-raised-button class="me-2" (click)="exportWallets()">
            Export
        </button>
        <button mat-raised-button (click)="deleteWallets()">
            Delete
        </button>
    </div>
</div>

<form>
    <div class="row mb-2">
        <div class="col-12">
            <mat-label>Filter</mat-label>
            <mat-form-field>
                <input matInput (keyup)="applyFilter($event)" placeholder="Search for a wallet" #input>
            </mat-form-field>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <table mat-table [dataSource]="dataSource">
                <ng-container matColumnDef="select">
                    <th mat-header-cell *matHeaderCellDef style="width: 100px;">
                        <mat-checkbox (change)="$event ? toggleAllRows() : null"
                            [checked]="selection.hasValue() && isAllSelected()"
                            [indeterminate]="selection.hasValue() && !isAllSelected()">
                        </mat-checkbox>
                    </th>
                    <td mat-cell *matCellDef="let row">
                        <mat-checkbox (click)="$event.stopPropagation()"
                            (change)="$event ? selection.toggle(row.id) : null"
                            [checked]="selection.isSelected(row.id)">
                        </mat-checkbox>
                    </td>
                </ng-container>

                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef style="width: 100px;"> # </th>
                    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                </ng-container>

                <ng-container matColumnDef="address">
                    <th mat-header-cell *matHeaderCellDef> Address </th>
                    <td mat-cell *matCellDef="let element"> {{addressAbrev(element.address)}} </td>
                </ng-container>

                <ng-container matColumnDef="nonce_account_address">
                    <th mat-header-cell *matHeaderCellDef> Nonce account </th>
                    <td mat-cell *matCellDef="let element">
                        <ng-container *ngIf="element.nonce_account_address">
                            {{addressAbrev(element.nonce_account_address)}}
                        </ng-container>
                        <ng-container *ngIf="!element.nonce_account_address">
                            <button mat-raised-button (click)="createNonceAccount(element)">
                                Create
                            </button>
                        </ng-container>
                    </td>
                </ng-container>

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef style="max-width: 200px;"> Name </th>
                    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                </ng-container>

                <ng-container matColumnDef="comments">
                    <th mat-header-cell *matHeaderCellDef style="max-width: 200px;"> Comments </th>
                    <td mat-cell *matCellDef="let element"> {{element.comments}} </td>
                </ng-container>

                <ng-container matColumnDef="balance">
                    <th mat-header-cell *matHeaderCellDef style="max-width: 200px;"> Balance </th>
                    <td mat-cell *matCellDef="let element"> {{element.balance}} </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <!-- Row shown when there is no matching data. -->
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell global-text-light" colspan="4">No data matching the filter "{{input.value}}"
                    </td>
                </tr>
            </table>
        </div>
    </div>
</form>
