apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  namespace: distributed-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aggregator
  template:
    metadata:
      labels:
        app: aggregator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: aggregator
          image: distributed-system/aggregator:dev
          ports:
            - containerPort: 3001
          env:
            - name: NATS_URL
              value: "nats://nats.distributed-system.svc.cluster.local:4222"
            - name: DATABASE_URL
              value: "postgres://distributed:distributed@postgres.distributed-system.svc.cluster.local:5432/aggregator"
            - name: AGGREGATOR_ADDR
              value: "0.0.0.0:3001"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.distributed-system.svc.cluster.local:4317"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aggregator
  namespace: distributed-system
spec:
  type: NodePort
  selector:
    app: aggregator
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
