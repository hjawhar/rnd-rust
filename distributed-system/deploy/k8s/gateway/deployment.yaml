apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: distributed-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: distributed-system/gateway:dev
          ports:
            - containerPort: 3000
          env:
            - name: NATS_URL
              value: "nats://nats.distributed-system.svc.cluster.local:4222"
            - name: GATEWAY_ADDR
              value: "0.0.0.0:3000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.distributed-system.svc.cluster.local:4317"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: distributed-system
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
